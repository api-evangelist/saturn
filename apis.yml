name: Saturn
description: >-
  Saturn is a mobile calendar and scheduling app built for high school students,
  designed around the complexities of the school day, built around your friends,
  and kept truly real-time. Students import their class schedule, see what their
  friends are doing, coordinate activities, and share their calendar socially.
  The company positions itself as "the next generation calendar, enabling time
  together for all." Saturn is a consumer iOS and Android application distributed
  through the App Store and Google Play; it exposes no public developer API,
  SDK, or documentation surface. Backed by General Catalyst and Insight Partners,
  with notable individual investors including Jeff Bezos, Marc Benioff, and Dara
  Khosrowshahi.
